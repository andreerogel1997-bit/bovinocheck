<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Cow silhouette stylized -->
  <g transform="translate(60,140)" fill="#fff">
    <!-- body -->
    <ellipse cx="200" cy="120" rx="160" ry="70"/>
    <!-- head -->
    <ellipse cx="60" cy="80" rx="55" ry="45"/>
    <!-- ears -->
    <ellipse cx="35" cy="40" rx="14" ry="22" transform="rotate(-30 35 40)"/>
    <ellipse cx="85" cy="40" rx="14" ry="22" transform="rotate(30 85 40)"/>
    <!-- legs -->
    <rect x="80" y="180" width="20" height="60" rx="6"/>
    <rect x="160" y="180" width="20" height="60" rx="6"/>
    <rect x="240" y="180" width="20" height="60" rx="6"/>
    <rect x="320" y="180" width="20" height="60" rx="6"/>
    <!-- tail -->
    <path d="M355,100 Q380,90 385,130 Q380,140 370,138" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="50" cy="75" r="5" fill="#065f46"/>
  </g>
  <!-- Check overlay (top-right) -->
  <g transform="translate(330,310)">
    <circle cx="60" cy="60" r="70" fill="#fbbf24"/>
    <path d="M30,62 L52,82 L94,40" stroke="#065f46" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
