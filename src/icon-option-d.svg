<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Vercel-style: pure geometry, monochrome, no gradient -->
  <rect width="512" height="512" rx="116" fill="#0a0a0f"/>
  <!-- Cloven bovine hoof print, abstracted -->
  <g fill="#ffffff" transform="translate(256 268)">
    <!-- Left claw -->
    <path d="M -112 -130
             C -158 -118, -168 -38, -132 50
             C -108 108, -56 132, -28 108
             C -10 78, -15 -2, -42 -70
             C -58 -112, -82 -138, -112 -130 Z"/>
    <!-- Right claw (mirror) -->
    <path d="M 112 -130
             C 158 -118, 168 -38, 132 50
             C 108 108, 56 132, 28 108
             C 10 78, 15 -2, 42 -70
             C 58 -112, 82 -138, 112 -130 Z"/>
  </g>
</svg>
