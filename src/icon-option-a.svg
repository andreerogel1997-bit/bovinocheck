<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gloss-a" x1="0%" y1="0%" x2="0%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow-a" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" in="SourceAlpha"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.25"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- background tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg-a)"/>
  <!-- subtle gloss -->
  <rect width="512" height="256" rx="116" fill="url(#gloss-a)"/>
  <!-- monogram BC, custom geometry -->
  <g filter="url(#shadow-a)" fill="#ffffff" font-family="Geist, system-ui, sans-serif" font-weight="900">
    <text x="50%" y="56%" text-anchor="middle" dominant-baseline="middle" font-size="240" letter-spacing="-12">BC</text>
  </g>
  <!-- accent dot (health pulse) -->
  <circle cx="384" cy="384" r="14" fill="#fbbf24"/>
  <circle cx="384" cy="384" r="22" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.5"/>
</svg>
