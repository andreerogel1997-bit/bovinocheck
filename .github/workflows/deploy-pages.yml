# Despliega solo src/ (la PWA) a GitHub Pages
# El resto del repo (research/, docs/, android/) NO se publica
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject Digital Asset Links placeholder (for future TWA)
        run: |
          mkdir -p src/.well-known
          if [ ! -f src/.well-known/assetlinks.json ]; then
            echo '[]' > src/.well-known/assetlinks.json
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'src'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
